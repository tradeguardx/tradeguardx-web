<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found — TradeGuardX</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Served by Vercel with a real 404 status for any path the rewrite in
      vercel.json deliberately does not hand to the SPA.

      Deliberately static and self-contained: it has to render correctly for a
      request that found no route, which is the one case where depending on the
      app bundle is least safe. No fonts, no JS, no CSS file.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 24px; background: #05070d; color: #e8eefc;
        font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: 100%; max-width: 460px; text-align: center; }
      .mark {
        width: 46px; height: 46px; margin: 0 auto 22px; border-radius: 14px;
        background: linear-gradient(145deg, #00d4aa, #00a98a);
        display: grid; place-items: center;
        box-shadow: 0 8px 22px -8px rgba(0, 212, 170, 0.8);
      }
      h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 12px 0 0; color: #9fb0c8; font-size: 14.5px; }
      .code {
        display: inline-block; margin-bottom: 14px; padding: 4px 10px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; color: #9fb0c8;
      }
      .actions { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block; padding: 11px 18px; border-radius: 11px;
        font-size: 14px; font-weight: 600; text-decoration: none;
      }
      .primary { background: #00d4aa; color: #02241d; }
      .ghost { color: #e8eefc; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16); }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#04140f"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v6c0 4.2-2.9 7.5-7 9-4.1-1.5-7-4.8-7-9V6l7-3z" />
          <path d="M9 12l2.2 2.2L15.5 10" />
        </svg>
      </div>
      <span class="code">404</span>
      <h1>This page doesn’t exist</h1>
      <p>The link may be out of date, or the address may have a typo in it.</p>
      <div class="actions">
        <a class="primary" href="/">Go to the homepage</a>
        <a class="ghost" href="/help">Help centre</a>
      </div>
    </main>
  </body>
</html>
